output HEADLESS-1 mode 1080x2388@60Hz scale 3 bg #1d3b53 solid_color transform 90
bar {
    position top
    height 36
    font monospace 10
    workspace_buttons no
    status_edge_padding 20
    status_command env VEGAS_SYSROOT=/tmp/strip-normal VEGAS_SBIN=/tmp/strip-normal/sbin /path/to/repo/linux/debian/overlay/usr/local/bin/vegas-status --bar 2>>/path/to/scratch/ui/strip-test/bar.err
    colors {
        background #000000
        statusline #e0e0e0
    }
}
