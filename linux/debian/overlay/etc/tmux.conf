# vegas: tmux inside foot keeps UTF-8 block characters and 24-bit colour (without these, tmux drew '_' and grey)
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"
set -ga update-environment " COLORTERM LANG"
set -g mouse on   # finger taps reach Textual apps even after windows are opened/killed (tested 2026-11-23)
# the phone UI look (bar on top, no clock); vegas-session sources it too, so a server first started by a bare `tmux`
# over SSH looks the same
source-file -q /etc/vegas/tmux-vegas.conf
