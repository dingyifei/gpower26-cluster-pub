# vegas-chargeguard thresholds (read by /usr/lib/vegas/chargeguard every 60 s)
STOP=80        # % : stop charging at or above
RESUME=70      # % : resume charging at or below
TSTOP=42       # degC battery: stop charging at or above
TRESUME=40     # degC battery: charging may resume only below this
TOFF=55        # degC battery: power off
SOCOFF=5       # % : power off when not charging
# CONTROL: auto | cmd (/proc/mtk_battery_cmd/current_cmd) | qpnp (qpnp_adaptive_charge limits) | none
CONTROL=auto
