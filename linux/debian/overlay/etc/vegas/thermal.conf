# vegas-thermal thresholds (read by /usr/lib/vegas/thermal at start; restart vegas-thermal after a change)
THOT=80        # degC soc_max: step the CPU caps down while at or above
TCOOL=70       # degC soc_max: step the CPU caps back up while at or below
TOFF=100       # degC soc_max: power off (the kernel's own critical trip is 113.5)
STEP=200000    # kHz per step, every INTERVAL seconds
FLOOR=40       # % of each policy's max frequency: the lowest cap
INTERVAL=2     # seconds between reads
