# vegas phone UI tmux look (spec 5.1). Sourced into the server by /usr/lib/vegas/vegas-session; /etc/tmux.conf keeps
# the terminal basics (mouse on, UTF-8, RGB). Bar on top under the strip; no clock, no periodic redraw (status-interval 0).
set -g status-position top
set -g status-interval 0
set -g status-style "bg=#1D2733,fg=#D5DBE3"
set -g status-left "[#{session_name}] "
set -g status-left-length 12
# clients on the phone's view: the whole group (phone + Mac) when grouped, else this session's own count
# (#{session_group_attached} alone is empty for a session that is not in a group)
# R14: the leading blank is part of status-right, so one blank cell always stands between the window list and
# "N attached"; when the list is cut, tmux's ">" ends the list area and comes before that blank ("4:sh> 1 attached").
set -g status-right " #{?session_grouped,#{session_group_attached},#{session_attached}} attached"
set -g status-right-style "fg=#7F8B99"
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W*"
set -g window-status-current-style "fg=#F0B429"
# Vol-up arrives as PageUp (vegas-keys): at a shell prompt it scrolls back (copy mode, leaves at the bottom);
# in programs (less, Textual pages) it stays a PageUp key.  [UNVERIFIED on #5]
bind -n PPage if -F '#{||:#{==:#{pane_current_command},bash},#{==:#{pane_current_command},sh}}' 'copy-mode -eu' 'send-keys PPage'
# Q1 (25 Nov): scrollback (copy mode) ends when scrolled back to the bottom, and when you type. Ways in (tmux 3.5a
# defaults + the PPage line above, measured in the VM with the bytes foot sends):
#   finger drag   foot 1.21 turns a touch that moves a text row within touch.long-press-delay (400 ms) into wheel
#                 events, one per row (sideways: horizontal wheel); tmux's WheelUpPane = copy-mode -e: scrolling back
#                 down to the bottom ends it (WheelDown = 5 lines each)
#   Vol-up        PageUp at a shell = copy-mode -eu; Vol-down (PageDown) at the bottom ends it
#   long press + drag   tmux selection (copy-mode -M); lifting the finger copies and ends it (MouseDragEnd1Pane)
# Typing: any key that is not a mouse event and not bound below ends copy mode and goes on to the shell (send-keys
# with no key = the key pressed; UTF-8 too). The copy-mode keys that are characters are unbound so they reach Any.
# Kept as copy mode: arrows, PageUp/PageDown, Home/End, Escape, C-c and Enter (end without typing; Enter: F2),
# C- letters (tmux's own copy-mode C- keys, the rest bound to do nothing below: F2 fix), tmux's own copy-mode M- keys,
# and every mouse event (the #{mouse_x} test: a tap, or the sideways drift of a scroll, never ends it). NOT covered
# (designer question, F2 fix): an M- key tmux has no copy-mode binding for (M-d, M-. ...) still ends copy mode and
# reaches the shell; the Any rule cannot tell modifiers apart (tmux 3.5a has no key-name format) and readline's M- keys
# edit but never run the line. The vi table
# (tmux picks it when EDITOR/VISUAL holds "vi" at server start) has Escape = clear-selection: bound to cancel below,
# so Escape ends copy mode in both tables.
# F2 (25 Nov follow-on to R15): Enter ends copy mode and is NOT passed on: a command line the person cannot see (the
# view is scrolled back) is never run. Enter arrives as \r from foot both for wvkbd's Enter key (evdev KEY_ENTER =
# keysym Return) and a hardware Return; tmux names \r "Enter" (= C-m). A keypad Enter comes as \eOM = KPEnter, since
# tmux puts foot in application keypad mode (smkx). tmux 3.5a defaults: emacs table has no Enter binding (it fell to
# Any = cancel + pass), vi table had Enter = copy-pipe-and-cancel (unbound for R15, so it also passed). Both now cancel.
bind -T copy-mode Any if -F '#{!=:#{mouse_x},}' {} { send-keys -X cancel; send-keys }
bind -T copy-mode-vi Any if -F '#{!=:#{mouse_x},}' {} { send-keys -X cancel; send-keys }
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode Enter send-keys -X cancel ; bind -T copy-mode KPEnter send-keys -X cancel
bind -T copy-mode-vi Enter send-keys -X cancel ; bind -T copy-mode-vi KPEnter send-keys -X cancel
# F2 fix (review, 25 Nov): every key that makes bash run the line ends copy mode and is NOT passed on, as Enter.
#   C-j (\n, bash accept-line; vi had copy-pipe-and-cancel, emacs had nothing = Any = cancel + pass)
#   Enter / KPEnter with Shift, Ctrl, Alt (foot: S-Enter \e[27;2;13~, C-Enter \e[27;5;13~, C-S-Enter \e[27;6;13~,
#   M-Enter \e\r; tmux had none of them, so Any passed them and bash ran the unseen line)
bind -T copy-mode C-j send-keys -X cancel ; bind -T copy-mode-vi C-j send-keys -X cancel
bind -T copy-mode S-Enter send-keys -X cancel ; bind -T copy-mode C-Enter send-keys -X cancel ; bind -T copy-mode M-Enter send-keys -X cancel ; bind -T copy-mode C-S-Enter send-keys -X cancel
bind -T copy-mode M-S-Enter send-keys -X cancel ; bind -T copy-mode C-M-Enter send-keys -X cancel ; bind -T copy-mode C-M-S-Enter send-keys -X cancel
bind -T copy-mode S-KPEnter send-keys -X cancel ; bind -T copy-mode C-KPEnter send-keys -X cancel ; bind -T copy-mode M-KPEnter send-keys -X cancel ; bind -T copy-mode C-S-KPEnter send-keys -X cancel
bind -T copy-mode M-S-KPEnter send-keys -X cancel ; bind -T copy-mode C-M-KPEnter send-keys -X cancel ; bind -T copy-mode C-M-S-KPEnter send-keys -X cancel
bind -T copy-mode-vi S-Enter send-keys -X cancel ; bind -T copy-mode-vi C-Enter send-keys -X cancel ; bind -T copy-mode-vi M-Enter send-keys -X cancel ; bind -T copy-mode-vi C-S-Enter send-keys -X cancel
bind -T copy-mode-vi M-S-Enter send-keys -X cancel ; bind -T copy-mode-vi C-M-Enter send-keys -X cancel ; bind -T copy-mode-vi C-M-S-Enter send-keys -X cancel
bind -T copy-mode-vi S-KPEnter send-keys -X cancel ; bind -T copy-mode-vi C-KPEnter send-keys -X cancel ; bind -T copy-mode-vi M-KPEnter send-keys -X cancel ; bind -T copy-mode-vi C-S-KPEnter send-keys -X cancel
bind -T copy-mode-vi M-S-KPEnter send-keys -X cancel ; bind -T copy-mode-vi C-M-KPEnter send-keys -X cancel ; bind -T copy-mode-vi C-M-S-KPEnter send-keys -X cancel
# F2 fix (review): C- letters stay scroll keys (F2/R15) instead of falling to Any (C-o = operate-and-get-next ran the
# unseen line). The C- keys tmux 3.5a leaves unbound in each table do nothing here (`if -F 1 {} {}` = no-op). Not
# bound: C-i = Tab and C-m = Enter (same keys to tmux), C-[ = Escape, C-c (cancel), C-j (above).
bind -T copy-mode C-d if -F 1 {} {} ; bind -T copy-mode C-h if -F 1 {} {} ; bind -T copy-mode C-l if -F 1 {} {} ; bind -T copy-mode C-o if -F 1 {} {}
bind -T copy-mode C-q if -F 1 {} {} ; bind -T copy-mode C-t if -F 1 {} {} ; bind -T copy-mode C-u if -F 1 {} {} ; bind -T copy-mode C-x if -F 1 {} {}
bind -T copy-mode C-y if -F 1 {} {} ; bind -T copy-mode C-z if -F 1 {} {} ; bind -T copy-mode 'C-\' if -F 1 {} {} ; bind -T copy-mode C-] if -F 1 {} {}
bind -T copy-mode C-^ if -F 1 {} {} ; bind -T copy-mode C-_ if -F 1 {} {}
bind -T copy-mode-vi C-a if -F 1 {} {} ; bind -T copy-mode-vi C-g if -F 1 {} {} ; bind -T copy-mode-vi C-k if -F 1 {} {} ; bind -T copy-mode-vi C-l if -F 1 {} {}
bind -T copy-mode-vi C-n if -F 1 {} {} ; bind -T copy-mode-vi C-o if -F 1 {} {} ; bind -T copy-mode-vi C-p if -F 1 {} {} ; bind -T copy-mode-vi C-q if -F 1 {} {}
bind -T copy-mode-vi C-r if -F 1 {} {} ; bind -T copy-mode-vi C-s if -F 1 {} {} ; bind -T copy-mode-vi C-t if -F 1 {} {} ; bind -T copy-mode-vi C-w if -F 1 {} {}
bind -T copy-mode-vi C-x if -F 1 {} {} ; bind -T copy-mode-vi C-z if -F 1 {} {} ; bind -T copy-mode-vi 'C-\' if -F 1 {} {} ; bind -T copy-mode-vi C-] if -F 1 {} {}
bind -T copy-mode-vi C-^ if -F 1 {} {} ; bind -T copy-mode-vi C-_ if -F 1 {} {}
unbind -q -T copy-mode Space ; unbind -q -T copy-mode , ; unbind -q -T copy-mode \; ; unbind -q -T copy-mode F
unbind -q -T copy-mode N ; unbind -q -T copy-mode P ; unbind -q -T copy-mode R ; unbind -q -T copy-mode T
unbind -q -T copy-mode X ; unbind -q -T copy-mode f ; unbind -q -T copy-mode g ; unbind -q -T copy-mode n
unbind -q -T copy-mode q ; unbind -q -T copy-mode r ; unbind -q -T copy-mode t
unbind -q -T copy-mode-vi Space ; unbind -q -T copy-mode-vi BSpace
unbind -q -T copy-mode-vi \# ; unbind -q -T copy-mode-vi \$ ; unbind -q -T copy-mode-vi \% ; unbind -q -T copy-mode-vi *
unbind -q -T copy-mode-vi , ; unbind -q -T copy-mode-vi / ; unbind -q -T copy-mode-vi : ; unbind -q -T copy-mode-vi \;
unbind -q -T copy-mode-vi ? ; unbind -q -T copy-mode-vi ^ ; unbind -q -T copy-mode-vi \{ ; unbind -q -T copy-mode-vi \}
unbind -q -T copy-mode-vi 0 ; unbind -q -T copy-mode-vi 1 ; unbind -q -T copy-mode-vi 2 ; unbind -q -T copy-mode-vi 3
unbind -q -T copy-mode-vi 4 ; unbind -q -T copy-mode-vi 5 ; unbind -q -T copy-mode-vi 6 ; unbind -q -T copy-mode-vi 7
unbind -q -T copy-mode-vi 8 ; unbind -q -T copy-mode-vi 9 ; unbind -q -T copy-mode-vi A ; unbind -q -T copy-mode-vi B
unbind -q -T copy-mode-vi D ; unbind -q -T copy-mode-vi E ; unbind -q -T copy-mode-vi F ; unbind -q -T copy-mode-vi G
unbind -q -T copy-mode-vi H ; unbind -q -T copy-mode-vi J ; unbind -q -T copy-mode-vi K ; unbind -q -T copy-mode-vi L
unbind -q -T copy-mode-vi M ; unbind -q -T copy-mode-vi N ; unbind -q -T copy-mode-vi P ; unbind -q -T copy-mode-vi T
unbind -q -T copy-mode-vi V ; unbind -q -T copy-mode-vi W ; unbind -q -T copy-mode-vi X ; unbind -q -T copy-mode-vi b
unbind -q -T copy-mode-vi e ; unbind -q -T copy-mode-vi f ; unbind -q -T copy-mode-vi g ; unbind -q -T copy-mode-vi h
unbind -q -T copy-mode-vi j ; unbind -q -T copy-mode-vi k ; unbind -q -T copy-mode-vi l ; unbind -q -T copy-mode-vi n
unbind -q -T copy-mode-vi o ; unbind -q -T copy-mode-vi q ; unbind -q -T copy-mode-vi r ; unbind -q -T copy-mode-vi t
unbind -q -T copy-mode-vi v ; unbind -q -T copy-mode-vi w ; unbind -q -T copy-mode-vi z
# On-screen keyboard rule (designer ruling 8): down while Home (0) or Network (1) is in front unless a text field has
# focus; a shell window gets back what the person chose. `auto` asks tmux which window of "main" is in front, so it is
# right even when the change came from the Mac's grouped session (the hook then reports the "mac" session) or from a
# window that closed. Silent and in the background (run-shell would show output in a pane). Calls the module itself
# (= `vegas-kbd auto`): a tmux server outlives updates, and an older vegas-kbd took no verbs (it would start a loop).
set-hook -g session-window-changed "run-shell -b 'PYTHONPATH=/usr/lib/vegas/ui python3 -m vegasui.uictl kbd auto >/dev/null 2>&1'"
