# vegas phone UI tmux look (spec 5.1). Sourced into the server by /usr/lib/vegas/vegas-session; /etc/tmux.conf keeps
# the terminal basics (mouse on, UTF-8, RGB). Bar on top under the strip; no clock, no periodic redraw (status-interval 0).
set -g status-position top
set -g status-interval 0
set -g status-style "bg=#1D2733,fg=#D5DBE3"
set -g status-left "[#{session_name}] "
set -g status-left-length 12
# clients on the phone's view: the whole group (phone + Mac) when grouped, else this session's own count
# (#{session_group_attached} alone is empty for a session that is not in a group)
set -g status-right "#{?session_grouped,#{session_group_attached},#{session_attached}} attached"
set -g status-right-style "fg=#7F8B99"
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W*"
set -g window-status-current-style "fg=#F0B429"
# Vol-up arrives as PageUp (vegas-keys): at a shell prompt it scrolls back (copy mode, leaves at the bottom);
# in programs (less, Textual pages) it stays a PageUp key.  [UNVERIFIED on #5]
bind -n PPage if -F '#{||:#{==:#{pane_current_command},bash},#{==:#{pane_current_command},sh}}' 'copy-mode -eu' 'send-keys PPage'
# On-screen keyboard rule (designer ruling 8): down while Home (0) or Network (1) is in front unless a text field has
# focus; a shell window gets back what the person chose. `auto` asks tmux which window of "main" is in front, so it is
# right even when the change came from the Mac's grouped session (the hook then reports the "mac" session) or from a
# window that closed. Silent and in the background (run-shell would show output in a pane). Calls the module itself
# (= `vegas-kbd auto`): a tmux server outlives updates, and an older vegas-kbd took no verbs (it would start a loop).
set-hook -g session-window-changed "run-shell -b 'PYTHONPATH=/usr/lib/vegas/ui python3 -m vegasui.uictl kbd auto >/dev/null 2>&1'"
