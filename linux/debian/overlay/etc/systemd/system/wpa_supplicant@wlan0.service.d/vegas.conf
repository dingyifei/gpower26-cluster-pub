# Not enabled at boot: /usr/lib/vegas/wifi-up starts it (--no-block) after wlan0 exists, so network.target and sshd
# never wait for the connsys bring-up. Without a network file (fresh image) it is skipped, not failed.
[Unit]
After=vegas-wifi.service
ConditionPathExists=/etc/wpa_supplicant/wpa_supplicant-wlan0.conf
